name: IG+FB Publish — Semana 8 Jul 20–26

on:
  schedule:
    - cron: '0 14 21 7 *'   # 901 — Mar Jul 21 14:00 UTC
    - cron: '0 19 22 7 *'   # 802 — Mié Jul 22 19:00 UTC
    - cron: '0 14 23 7 *'   # 902 — Jue Jul 23 14:00 UTC
    - cron: '0 19 24 7 *'   # 803 — Vie Jul 24 19:00 UTC
    - cron: '0 14 25 7 *'   # 903 — Sáb Jul 25 14:00 UTC
  workflow_dispatch:
    inputs:
      clip_num:
        description: 'Clip number to publish (901, 802, 902, 803, 903)'
        required: true
        default: '901'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Select clip by schedule
        id: clip
        run: |
          DOW=$(date -u +%u)   # 1=Mon, 2=Tue, ...
          INPUT_NUM="${{ github.event.inputs.clip_num }}"

          if [ -n "$INPUT_NUM" ]; then
            NUM="$INPUT_NUM"
          elif [ "$DOW" = "2" ]; then
            NUM="901"
          elif [ "$DOW" = "3" ]; then
            NUM="802"
          elif [ "$DOW" = "4" ]; then
            NUM="902"
          elif [ "$DOW" = "5" ]; then
            NUM="803"
          elif [ "$DOW" = "6" ]; then
            NUM="903"
          else
            echo "No clip scheduled today (DOW=$DOW)"
            exit 1
          fi
          echo "num=$NUM" >> $GITHUB_OUTPUT

          case "$NUM" in
            901)
              echo "video_url=https://res.cloudinary.com/dr9dtabgq/video/upload/v1784602797/redentor/semana_jul20-26/-fugC0R3snY/clip_901.mp4" >> $GITHUB_OUTPUT
              echo 'caption=¿Te casas para escapar de tu familia?

Casarse por las razones equivocadas es la receta del fracaso — descubre cuándo el matrimonio NO es la respuesta.

📖 Clase completa en YouTube — ¡gratis! ↓
https://youtube.com/live/-fugC0R3snY

#matrimonio #consejosmatrimoniales #vidacristiana #solteros #iglesiacristiana #relacionessanas #fe #EscuelaParaLaVida #MatrimonioFeliz #ConsejosDeVida #FamiliaRedentor #TemperamentosMatrimoniales #EscuelaDominical #Redentor #Chihuahua #Iglesia #Fe #Dios' >> $GITHUB_OUTPUT
              ;;
            802)
              echo "video_url=https://res.cloudinary.com/dr9dtabgq/video/upload/v1784602834/redentor/semana_jul20-26/FtoBvX1vqFQ/clip_802.mp4" >> $GITHUB_OUTPUT
              echo 'caption=Usted es de Dios, no lo olvide

Tu identidad no la define tu nombre, tu país ni tu situación — la define a quién perteneces: a Cristo.

🎙️ Mira la predicación COMPLETA en YouTube ↓
https://youtu.be/FtoBvX1vqFQ

#identidadcristiana #hijosDeDios #fe #Cristo #predicacion #vidacristiana #iglesia #EscuelaParaLaVida #MatrimonioFeliz #ConsejosDeVida #FamiliaRedentor #TemperamentosMatrimoniales #EscuelaDominical #Redentor #Chihuahua #Iglesia #Fe #Dios' >> $GITHUB_OUTPUT
              ;;
            902)
              echo "video_url=https://res.cloudinary.com/dr9dtabgq/video/upload/v1784602860/redentor/semana_jul20-26/-fugC0R3snY/clip_902.mp4" >> $GITHUB_OUTPUT
              echo 'caption=El problema de casarse en el momento equivocado

El momento en que te casas importa tanto como con quién te casas — aprende a reconocer cuándo el horno no está para bollos.

📖 Clase completa en YouTube — ¡gratis! ↓
https://youtube.com/live/-fugC0R3snY

#matrimonio #consejoscristianos #solteros #vidacristiana #relacionessanas #iglesiacristiana #sabiduría #EscuelaParaLaVida #MatrimonioFeliz #ConsejosDeVida #FamiliaRedentor #TemperamentosMatrimoniales #EscuelaDominical #Redentor #Chihuahua #Iglesia #Fe #Dios' >> $GITHUB_OUTPUT
              ;;
            803)
              echo "video_url=https://res.cloudinary.com/dr9dtabgq/video/upload/v1784602889/redentor/semana_jul20-26/FtoBvX1vqFQ/clip_803.mp4" >> $GITHUB_OUTPUT
              echo 'caption=No te perteneces a ti mismo

Antes éramos esclavos del pecado, muertos en delitos — pero el Señor extendió su mano y aquí estamos, redimidos.

🎙️ Mira la predicación COMPLETA en YouTube ↓
https://youtu.be/FtoBvX1vqFQ

#redimidos #gracia #salvacion #Cristo #fe #predicacion #iglesia #EscuelaParaLaVida #MatrimonioFeliz #ConsejosDeVida #FamiliaRedentor #TemperamentosMatrimoniales #EscuelaDominical #Redentor #Chihuahua #Iglesia #Fe #Dios' >> $GITHUB_OUTPUT
              ;;
            903)
              echo "video_url=https://res.cloudinary.com/dr9dtabgq/video/upload/v1784602932/redentor/semana_jul20-26/-fugC0R3snY/clip_903.mp4" >> $GITHUB_OUTPUT
              echo 'caption=No confundas inmadurez con don de celibato

La razón real por la que muchos jóvenes no se quieren casar no tiene nada que ver con un llamado divino.

📖 Clase completa en YouTube — ¡gratis! ↓
https://youtube.com/live/-fugC0R3snY

#solteros #matrimoniocristiano #madurezdez #vidacristiana #consejoscristianos #iglesiacristiana #relacionessanas #EscuelaParaLaVida #MatrimonioFeliz #ConsejosDeVida #FamiliaRedentor #TemperamentosMatrimoniales #EscuelaDominical #Redentor #Chihuahua #Iglesia #Fe #Dios' >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Publish Reel to Instagram
        id: ig
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: "17841456697845516"
        run: |
          VIDEO_URL="${{ steps.clip.outputs.video_url }}"
          CAPTION="${{ steps.clip.outputs.caption }}"
          NUM="${{ steps.clip.outputs.num }}"

          echo "📤 Creando container IG para clip $NUM..."
          CONTAINER=$(curl -s -X POST \
            "https://graph.facebook.com/v19.0/${IG_ACCOUNT_ID}/media" \
            -d "media_type=REELS" \
            --data-urlencode "video_url=${VIDEO_URL}" \
            --data-urlencode "caption=${CAPTION}" \
            -d "share_to_feed=true" \
            --data-urlencode "access_token=${META_ACCESS_TOKEN}")

          echo "Container response: $CONTAINER"
          CONTAINER_ID=$(echo "$CONTAINER" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ -z "$CONTAINER_ID" ]; then
            echo "❌ Error creando container"
            exit 1
          fi

          echo "Container ID: $CONTAINER_ID"
          echo "⏳ Esperando procesamiento..."

          for i in $(seq 1 18); do
            sleep 10
            STATUS_RESP=$(curl -s "https://graph.facebook.com/v19.0/${CONTAINER_ID}?fields=status_code,status&access_token=${META_ACCESS_TOKEN}")
            STATUS=$(echo "$STATUS_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status_code', d.get('status','')))")
            echo "[$i/18] Status: $STATUS"
            if [ "$STATUS" = "FINISHED" ]; then
              break
            fi
            if [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "EXPIRED" ]; then
              echo "❌ Error en procesamiento: $STATUS_RESP"
              exit 1
            fi
          done

          echo "📣 Publicando reel..."
          PUB=$(curl -s -X POST \
            "https://graph.facebook.com/v19.0/${IG_ACCOUNT_ID}/media_publish" \
            --data-urlencode "creation_id=${CONTAINER_ID}" \
            --data-urlencode "access_token=${META_ACCESS_TOKEN}")

          echo "Publish response: $PUB"
          REEL_ID=$(echo "$PUB" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ -n "$REEL_ID" ]; then
            echo "✅ Reel $NUM publicado en Instagram: $REEL_ID"
          else
            echo "❌ Error publicando en Instagram"
            exit 1
          fi

      - name: Publish Reel to Facebook
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          PAGE_ID: "532062283670945"
        run: |
          VIDEO_URL="${{ steps.clip.outputs.video_url }}"
          CAPTION="${{ steps.clip.outputs.caption }}"
          NUM="${{ steps.clip.outputs.num }}"

          echo "📤 Publicando en Facebook clip $NUM..."
          FB=$(curl -s -X POST \
            "https://graph.facebook.com/v19.0/${PAGE_ID}/videos" \
            --data-urlencode "file_url=${VIDEO_URL}" \
            --data-urlencode "description=${CAPTION}" \
            --data-urlencode "access_token=${META_PAGE_TOKEN}")

          echo "FB response: $FB"
          FB_ID=$(echo "$FB" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ -n "$FB_ID" ]; then
            echo "✅ Reel $NUM publicado en Facebook: $FB_ID"
          else
            echo "❌ Error publicando en Facebook"
            exit 1
          fi
